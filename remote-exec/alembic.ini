# The coordinator's migrations: `alembic upgrade head` from this directory, with REMOTE_EXEC_DATABASE_URL set.
[alembic]
script_location = %(here)s/remote_exec/alembic
version_table = remote_exec_alembic_version
sqlalchemy.url =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
