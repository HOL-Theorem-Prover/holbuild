name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      test-jobs:
        description: 'Number of holbuild test cases to run concurrently'
        required: false
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
      - name: Bound coordinator HTTP liveness under 400 concurrent claimers
        working-directory: remote-exec
        run: uv run --frozen pytest -q -s tests/test_http_liveness.py
        env:
          REMOTE_EXEC_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

      - name: Read HOL4 pin
        id: hol4-pin
        run: echo "hol4-ref=$(tr -d '[:space:]' < vendor/hol/REV)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - uses: ./.github/actions/setup-trknl-polyml
        id: trknl-polyml

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inotify-tools

      - name: Configure holbuild test cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      - name: Restore HOL toolchain cache
        id: hol-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-with-trknl-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.trknl-polyml.outputs.polyml-rev }}-${{ steps.hol4-pin.outputs.hol4-ref }}-v2

      - name: Build holbuild
        run: make

      - name: Setup schema2 HOL cache
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          {
            echo '[holbuild]'
            echo 'schema = 2'
            echo 'minimum_version = "0.10.0"'
            echo
            echo '[dependencies.hol]'
            echo 'git = "https://github.com/HOL-Theorem-Prover/HOL.git"'
            echo 'rev = "${{ steps.hol4-pin.outputs.hol4-ref }}"'
            echo
            echo '[project]'
            echo 'name = "ci-toolchain"'
          } > "$tmp/holproject.toml"
          holdir=$(cd "$tmp" && "$GITHUB_WORKSPACE/bin/holbuild" buildhol | tail -n 1)
          trknl_holdir=$(cd "$tmp" && HOLBUILD_POLY="${{ steps.trknl-polyml.outputs.polyml-bin }}" "$GITHUB_WORKSPACE/bin/holbuild" buildhol --trknl | tail -n 1)
          echo "HOLDIR=$holdir" >> "$GITHUB_ENV"
          echo "HOLBUILD_TRKNL_POLY=${{ steps.trknl-polyml.outputs.polyml-bin }}" >> "$GITHUB_ENV"
          echo "Tracing HOLDIR: $trknl_holdir"

      - name: Save HOL toolchain cache
        if: steps.hol-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-with-trknl-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.trknl-polyml.outputs.polyml-rev }}-${{ steps.hol4-pin.outputs.hol4-ref }}-v2

      - name: Check native client interruption and reattachment
        working-directory: remote-exec
        run: uv run --frozen pytest -q tests/native_interrupted_output.py
        env:
          REMOTE_EXEC_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
          HOLBUILD_TEST_JOBS: ${{ inputs.test-jobs || '4' }}
        run: make HOLDIR="$HOLDIR" test

  legacy-tactics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Read legacy tactic ABI pin
        id: legacy-hol4-pin
        run: echo "hol4-ref=$(tr -d '[:space:]' < tests/HOL_LEGACY_TACTICS_REV)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - name: Configure holbuild test cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      - name: Restore legacy HOL toolchain cache
        id: legacy-hol-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-legacy-tactics-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.legacy-hol4-pin.outputs.hol4-ref }}-v1

      - name: Build holbuild
        run: make

      - name: Setup legacy HOL cache
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          {
            echo '[holbuild]'
            echo 'schema = 2'
            echo 'minimum_version = "0.10.0"'
            echo
            echo '[dependencies.hol]'
            echo 'git = "https://github.com/HOL-Theorem-Prover/HOL.git"'
            echo 'rev = "${{ steps.legacy-hol4-pin.outputs.hol4-ref }}"'
            echo
            echo '[project]'
            echo 'name = "ci-legacy-tactics-toolchain"'
          } > "$tmp/holproject.toml"
          holdir=$(cd "$tmp" && "$GITHUB_WORKSPACE/bin/holbuild" buildhol | tail -n 1)
          echo "HOLDIR=$holdir" >> "$GITHUB_ENV"

      - name: Save legacy HOL toolchain cache
        if: steps.legacy-hol-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-legacy-tactics-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.legacy-hol4-pin.outputs.hol4-ref }}-v1

      - name: Run legacy tactic compatibility tests
        env:
          TMPDIR: ${{ runner.temp }}
          HOLBUILD_TEST_JOBS: ${{ inputs.test-jobs || '4' }}
          HOLBUILD_TEST_HOL_REV: ${{ steps.legacy-hol4-pin.outputs.hol4-ref }}
        run: >-
          make HOLDIR="$HOLDIR" test
          TESTS="proof-attributes tactic-parse-compatibility proof-step-runtime-semantics proof-ir-branch-composition-behavior failed-prefix-structural-edit checkpoint-recovery termination-diagnostics smt-tactic-timeout"

  theory-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Read theory-module HOL pin
        id: module-hol4-pin
        run: echo "hol4-ref=$(tr -d '[:space:]' < tests/HOL_THEORY_MODULES_REV)" >> "$GITHUB_OUTPUT"

      # Theory modules need the dependent-module support of the
      # v5.9.2-seq4 runtime; v5.9.2-seq5 leaves it out.
      - uses: ./.github/actions/setup-polyml
        id: polyml
        with:
          polyml-tag: v5.9.2-seq4

      - name: Configure holbuild test cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      - name: Restore theory-module HOL toolchain cache
        id: module-hol-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-theory-modules-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.module-hol4-pin.outputs.hol4-ref }}-v1

      - name: Build holbuild
        run: make

      - name: Run theory-module integration tests
        env:
          TMPDIR: ${{ runner.temp }}
          HOLBUILD_TEST_JOBS: '4'
          HOLBUILD_TEST_HOL_REV: ${{ steps.module-hol4-pin.outputs.hol4-ref }}
          HOLBUILD_TEST_REQUIRE_THEORY_MODULES: '1'
        run: >-
          tests/run.sh theory-modules basic-theory checkpoint-extra-inputs
          checkpoint-recovery exec-action exec-action-share-heaps

      - name: Save theory-module HOL toolchain cache
        if: steps.module-hol-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/holbuild/hol-toolchains
          key: hol-toolchains-theory-modules-${{ runner.os }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.module-hol4-pin.outputs.hol4-ref }}-v1
