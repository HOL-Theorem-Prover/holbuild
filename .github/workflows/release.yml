name: Release binaries

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - Makefile
      - LICENSE
      - man/**
      - completions/**
      - sml/holbuild-script.sml
      - sml/action_sandbox.py
      - sml/ahead_load_runtime.sml
      - sml/checkpoint_save_runtime.sml
      - sml/holbuild_runtime.sml
      - sml/deferred_proofs_runtime.sml
      - sml/fingerprint_runtime.sml
      - sml/proof_runtime.sml
      - sml/tactic_compat_runtime.sml
      - sml/diagnostic_limits.sml
      - sml/sha256.sml
      - sml/spawn.sml
      - sml/temp_path.sml
      - sml/hash.sml
      - sml/proof_ir_types.sml
      - sml/proof_ir.sml
      - sml/analyser/**
      - vendor/hol/**
      - tests/lib.sh
      - tests/cases/installed-runtime/**
      - tools/release-consumer*.sh
      - tests/cases/release-consumers/**
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  POLYML_TAG: v5.9.2-seq7

jobs:
  build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build static Poly/ML
        run: |
          git clone --depth 1 --branch "$POLYML_TAG" https://github.com/sequent-dev-bot/polyml.git "$RUNNER_TEMP/polyml"
          cd "$RUNNER_TEMP/polyml"
          ./configure --prefix="$RUNNER_TEMP/polyml-install" --disable-shared --without-gmp
          make -j4
          make install
          echo "$RUNNER_TEMP/polyml-install/bin" >> "$GITHUB_PATH"

      - name: Build and package holbuild
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          make
          HOLBUILD_ROOT="$PWD" tests/cases/installed-runtime/test.sh "$PWD/bin/holbuild" ""
          version=$(bin/holbuild --version | cut -d ' ' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          name="holbuild-v$version-$PLATFORM"
          stage="$RUNNER_TEMP/package/$name"
          make install PREFIX=/ DESTDIR="$stage"
          cp LICENSE "$stage/LICENSE"
          cp "$RUNNER_TEMP/polyml/COPYING" "$stage/share/holbuild/copyrights/polyml-LGPL-2.1.txt"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP/package" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          if [[ "$PLATFORM" == linux-x86_64 ]]; then
            source_name="polyml-$POLYML_TAG-source.tar.gz"
            git -C "$RUNNER_TEMP/polyml" archive --format=tar.gz --prefix=polyml/ HEAD > "dist/$source_name"
            (cd dist && shasum -a 256 "$source_name" > "$source_name.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # No checkout or compiler setup: the build's source/install paths don't exist.
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: download

      - name: Verify downloaded archive without Poly/ML
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if command -v poly || command -v polyc; then
            echo 'Smoke runner unexpectedly has Poly/ML installed' >&2
            exit 1
          fi
          cd download
          shasum -a 256 -c ./*.sha256
          archives=(holbuild-*.tar.gz)
          test "${#archives[@]}" = 1
          tar -xzf "${archives[0]}"
          roots=(holbuild-*/)
          test "${#roots[@]}" = 1
          root=${roots[0]%/}
          test -s "$root/LICENSE"
          test -s "$root/share/holbuild/copyrights/smlnj.txt"
          test -s "$root/share/holbuild/copyrights/polyml-LGPL-2.1.txt"
          test -s "$root/share/holbuild/sml/holbuild_runtime.sml"
          test -s "$root/share/man/man1/holbuild.1"
          if [[ "$PLATFORM" == linux-* ]]; then
            ldd "$root/bin/holbuild" | tee dependencies.txt
            if grep -E 'libpolyml|libgmp|not found' dependencies.txt; then
              echo 'Unexpected non-system or missing library dependency' >&2
              exit 1
            fi
          else
            otool -L "$root/bin/holbuild" | tee dependencies.txt
            if tail -n +2 dependencies.txt | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
              echo 'Unexpected non-system library dependency' >&2
              exit 1
            fi
          fi
          version=${root#holbuild-v}
          version=${version%-$PLATFORM}
          test "$("$root/bin/holbuild" --version)" = "holbuild $version"

  consumers:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: download

      - uses: ./.github/actions/setup-polyml
        with:
          polyml-tag: ${{ env.POLYML_TAG }}

      - name: Build three consumer mains
        env:
          GH_REPO: ${{ github.repository }}
          HOLBUILD_REMOTE_EXEC_URL: ${{ vars.HOLBUILD_REMOTE_EXEC_URL }}
          HOLBUILD_REMOTE_CACHE_URL: ${{ vars.HOLBUILD_REMOTE_CACHE_URL }}
          EXEC_CURL_CONFIG_CONTENT: ${{ secrets.HOLBUILD_REMOTE_EXEC_CURL_CONFIG }}
          CACHE_CURL_CONFIG_CONTENT: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}
        run: tools/release-consumer-check.sh

      - name: Retain candidate and consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-consumers/evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [smoke, consumers]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Attach verified binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # A breaking release stays a draft until its consumers are ready;
            # see "Release process" in README.md.
            hold=()
            if ! base=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name); then
              reasons="no published release to compare with"
              hold=(--draft)
            else
              status=0
              reasons=$(tools/release-breaking.sh "$base" "$TAG") || status=$?
              case $status in
                0) ;;
                1) hold=(--draft) ;;
                *) exit "$status" ;;
              esac
            fi
            if [[ ${#hold[@]} -ne 0 ]]; then
              notes=$(printf 'Breaking release:\n\n%s\n' "$(sed 's/^/- /' <<< "$reasons")")
              printf '%s\n' "$notes" >> "$GITHUB_STEP_SUMMARY"
              hold+=(--notes "$notes")
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${hold[@]}"
          fi
          cd dist
          cat ./*.sha256 > SHA256SUMS
          gh release upload "$TAG" ./*.tar.gz SHA256SUMS --clobber

  # A release published by hand (a draft made before the tag, say) skips the
  # check in `publish`; this one turns a breaking release back into a draft
  # unless its notes say its consumers are ready. Releases the workflow itself
  # creates use GITHUB_TOKEN, so they don't trigger it.
  guard:
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Hold a breaking release back as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          if ! tools/release-consumers-verified.sh "$TAG" "$(git rev-parse HEAD)"; then
            gh release edit "$TAG" --draft=true
            echo "::error::$TAG has no successful exact-candidate consumer check; turned back into a draft"
            exit 1
          fi
          if grep -q '^Consumers ready:' <<< "$BODY"; then
            echo "$TAG: consumers marked ready, published on purpose"
            exit 0
          fi
          # The base is the newest earlier release that was already trusted
          # when this one was published: out for more than an hour, or marked
          # "Consumers ready:". A release published moments ago may itself be
          # an unchecked breaking one whose own guard hasn't run yet. A failed
          # listing fails the step, so an empty base always means there is no
          # such release.
          list=$(gh api --paginate "repos/$GH_REPO/releases" \
                   --jq '.[] | select(.draft or .prerelease | not)
                         | "\(.tag_name) \(if (.body // "") | test("(?m)^Consumers ready:") then "ready" else "-" end) \(.published_at | fromdateiso8601)"')
          since=$(( $(date -d "$PUBLISHED_AT" +%s) - 3600 ))
          base=$({ awk -v t="$TAG" -v since="$since" \
                     'NF && $1 != t && ($2 == "ready" || $3 <= since) { print $1 }' <<< "$list"
                   echo "$TAG"; } |
                 sort -V | awk -v t="$TAG" '$0 == t { print prev; exit } { prev = $0 }')
          if [[ -z "$base" ]]; then
            reasons="no earlier published release to compare with"
          else
            status=0
            reasons=$(tools/release-breaking.sh "$base" "$TAG") || status=$?
            case $status in
              0) exit 0 ;;
              1) ;;
              *) exit "$status" ;;
            esac
          fi
          notes=$(printf 'Breaking release:\n\n%s\n\nHeld as a draft: published without `Consumers ready:` in its notes.\n' \
                    "$(sed 's/^/- /' <<< "$reasons")")
          gh release edit "$TAG" --draft=true --notes "$(printf '%s\n\n%s\n' "$notes" "$BODY")"
          printf '%s\n' "$notes" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$TAG is breaking and was published without 'Consumers ready:'; turned back into a draft"
          exit 1
