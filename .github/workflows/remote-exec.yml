name: remote-exec

on:
  pull_request:
    paths: ['remote-exec/**', '.github/workflows/remote-exec.yml', 'sml/action_sandbox.*', 'tests/fixtures/action_sandbox_probe.py', 'Makefile']
  push:
    branches: [master]
    paths: ['remote-exec/**', '.github/workflows/remote-exec.yml', 'sml/action_sandbox.*', 'tests/fixtures/action_sandbox_probe.py', 'Makefile']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: remote-exec
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Tests
        run: uv run --frozen pytest --ignore=tests/test_coordinator_load.py
        env:
          REMOTE_EXEC_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Coordinator HTTP load and liveness
        run: uv run --frozen pytest -s tests/test_coordinator_load.py
        env:
          REMOTE_EXEC_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t holbuild-remote-exec remote-exec
      - name: Start the coordinator from the image
        run: |
          docker run --rm --network host -e REMOTE_EXEC_DATABASE_URL="$DATABASE_URL" holbuild-remote-exec migrate
          docker run -d --name coordinator --network host -e REMOTE_EXEC_DATABASE_URL="$DATABASE_URL" \
            -e REMOTE_EXEC_CLIENT_TOKEN=client -e REMOTE_EXEC_WORKER_TOKEN=worker \
            -e REMOTE_EXEC_CACHE_URL=http://127.0.0.1:1 holbuild-remote-exec coordinator
          for _ in $(seq 30); do
            if curl -fsS -H 'Authorization: Bearer client' http://127.0.0.1:8090/v1/queue; then exit 0; fi
            sleep 1
          done
          docker logs coordinator
          exit 1
      - name: Check that orphaned processes are reaped
        run: |
          docker run --rm holbuild-remote-exec python3 -c '
          import pathlib, subprocess, time
          subprocess.run(["sh", "-c", "sleep 1 &"])
          time.sleep(3)
          zombies = [p for p in pathlib.Path("/proc").glob("[0-9]*/status") if "\nState:\tZ" in p.read_text()]
          assert not zombies, zombies'
      - name: Build a holbuild release the way a worker does
        run: |
          git archive --format=tar.gz --prefix=holbuild/ HEAD > "$RUNNER_TEMP/holbuild-source.tar.gz"
          version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' sml/version.sml)
          docker run --rm -v releases:/opt/holbuild-releases \
            -v "$RUNNER_TEMP/holbuild-source.tar.gz:/source.tar.gz:ro" holbuild-remote-exec python3 -c \
            'import sys; from remote_exec.worker import Releases; print(Releases("/opt/holbuild-releases", "file:///source.tar.gz", "", None).holbuild(sys.argv[1]))' "$version"
          docker run --rm -v releases:/opt/holbuild-releases holbuild-remote-exec \
            "/opt/holbuild-releases/v$version/bin/holbuild" --version
      - name: Probe action isolation as root and as a worker user
        run: |
          for user in 0:0 10001:10001; do
            docker run --rm --user "$user" -v "$PWD:/source:ro" holbuild-remote-exec \
              python3 /source/tests/fixtures/action_sandbox_probe.py /source/sml/action_sandbox.py
          done
