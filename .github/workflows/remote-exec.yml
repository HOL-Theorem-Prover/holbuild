name: remote-exec

on:
  pull_request:
    paths: ['remote-exec/**', '.github/workflows/remote-exec.yml']
  push:
    branches: [master]
    paths: ['remote-exec/**', '.github/workflows/remote-exec.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: remote-exec
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Tests
        run: uv run --frozen pytest
        env:
          REMOTE_EXEC_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t holbuild-remote-exec remote-exec
      - name: Start the coordinator from the image
        run: |
          docker run --rm --network host -e REMOTE_EXEC_DATABASE_URL="$DATABASE_URL" holbuild-remote-exec migrate
          docker run -d --name coordinator --network host -e REMOTE_EXEC_DATABASE_URL="$DATABASE_URL" \
            -e REMOTE_EXEC_CLIENT_TOKEN=client -e REMOTE_EXEC_WORKER_TOKEN=worker \
            -e REMOTE_EXEC_CACHE_URL=http://127.0.0.1:1 holbuild-remote-exec coordinator
          for _ in $(seq 30); do
            if curl -fsS -H 'Authorization: Bearer client' http://127.0.0.1:8090/v1/queue; then exit 0; fi
            sleep 1
          done
          docker logs coordinator
          exit 1
      - name: Check that orphaned processes are reaped
        run: |
          docker run --rm holbuild-remote-exec python3 -c '
          import pathlib, subprocess, time
          subprocess.run(["sh", "-c", "sleep 1 &"])
          time.sleep(3)
          zombies = [p for p in pathlib.Path("/proc").glob("[0-9]*/status") if "\nState:\tZ" in p.read_text()]
          assert not zombies, zombies'
      - name: Build a holbuild release the way a worker does
        run: |
          docker run --rm -v releases:/opt/holbuild-releases holbuild-remote-exec python3 -c \
            'from remote_exec.worker import DEFAULT_SOURCE_URL, Releases; print(Releases("/opt/holbuild-releases", DEFAULT_SOURCE_URL, "", None).holbuild("0.13.1"))'
          docker run --rm -v releases:/opt/holbuild-releases holbuild-remote-exec /opt/holbuild-releases/v0.13.1/bin/holbuild --version
